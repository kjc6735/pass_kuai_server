worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_max_body_size 3m;
  client_body_timeout 30s;

  upstream api {
    server server:3000;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://passkuai.com$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name www.passkuai.com;

    ssl_certificate /etc/letsencrypt/live/passkuai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passkuai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://passkuai.com$request_uri;
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    server_name passkuai.com;

    ssl_certificate /etc/letsencrypt/live/passkuai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/passkuai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ ^/api/metrics(/|$) {
      return 404;
    }

    location = /api {
      return 301 /api/;
    }

    location /api/ {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 200s;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri.html $uri/ =404;
    }
  }
}
